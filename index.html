<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Baby Shower Wishes 💕</title>

  <meta
    name="description"
    content="Leave a little love and a special message for the parents-to-be."
  />

  <!--
    Google Fonts
    You can remove this if you'd prefer everything to work without
    loading an external font.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --cream: #fffaf5;
      --paper: #fffdfb;
      --peach: #f8cfc1;
      --peach-dark: #d98e7d;
      --pink: #f3b8c4;
      --pink-dark: #c96f83;
      --sage: #c9d8c0;
      --sage-dark: #71866a;
      --blue: #c8ddeb;
      --gold: #e5c58a;
      --ink: #443d3b;
      --muted: #807571;
      --white: #ffffff;
      --shadow: 0 18px 50px rgba(93, 70, 62, 0.10);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, rgba(248, 207, 193, .55), transparent 25%),
        radial-gradient(circle at 90% 15%, rgba(201, 216, 192, .55), transparent 25%),
        radial-gradient(circle at 50% 100%, rgba(200, 221, 235, .45), transparent 35%),
        var(--cream);
      font-family: "DM Sans", sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: min(100%, 1100px);
      margin: 0 auto;
      padding: 28px 18px 60px;
    }

    /* -------------------------------------------------------
       HERO / CARD
    ------------------------------------------------------- */

    .card {
      position: relative;
      overflow: hidden;
      background: rgba(255, 253, 251, .93);
      border: 1px solid rgba(217, 142, 125, .16);
      border-radius: 34px;
      box-shadow: var(--shadow);
    }

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .card::before {
      width: 280px;
      height: 280px;
      top: -150px;
      left: -100px;
      background: rgba(248, 207, 193, .30);
    }

    .card::after {
      width: 250px;
      height: 250px;
      right: -110px;
      bottom: -140px;
      background: rgba(201, 216, 192, .30);
    }

    .hero {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 62px 24px 54px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--pink-dark);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .hero h1 {
      margin: 0;
      color: var(--ink);
      font-family: "Playfair Display", serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 600;
      line-height: 1.05;
    }

    .hero h1 span {
      display: block;
      color: var(--peach-dark);
      font-family: "Caveat", cursive;
      font-size: .72em;
      font-weight: 600;
    }

    .hero p {
      max-width: 580px;
      margin: 24px auto 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .decorations {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin: 28px 0 0;
      color: var(--gold);
      font-size: 1.35rem;
    }

    .decorations .center {
      color: var(--pink-dark);
      font-size: 1.7rem;
    }

    /* -------------------------------------------------------
       SIGN BUTTON
    ------------------------------------------------------- */

    .sign-area {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      padding: 0 24px 58px;
    }

    .sign-button {
      border: 0;
      border-radius: 999px;
      padding: 15px 28px;
      color: var(--white);
      background: linear-gradient(135deg, var(--pink-dark), var(--peach-dark));
      box-shadow: 0 10px 24px rgba(201, 111, 131, .22);
      font-size: .98rem;
      font-weight: 700;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .sign-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(201, 111, 131, .28);
    }

    .sign-button:active {
      transform: translateY(0);
    }

    /* -------------------------------------------------------
       FORM
    ------------------------------------------------------- */

    .form-wrapper {
      display: none;
      position: relative;
      z-index: 2;
      max-width: 620px;
      margin: -12px auto 58px;
      padding: 0 24px;
    }

    .form-wrapper.visible {
      display: block;
      animation: fadeUp .35s ease both;
    }

    .form-card {
      padding: 30px;
      border: 1px solid rgba(217, 142, 125, .20);
      border-radius: var(--radius);
      background: #fff8f4;
    }

    .form-card h2 {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: 1.7rem;
    }

    .form-card .intro {
      margin: 7px 0 24px;
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.55;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: .84rem;
      font-weight: 700;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: 1px solid #ead9d3;
      border-radius: 14px;
      outline: none;
      padding: 13px 14px;
      color: var(--ink);
      background: var(--white);
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--peach-dark);
      box-shadow: 0 0 0 4px rgba(217, 142, 125, .10);
    }

    .field textarea {
      min-height: 120px;
      resize: vertical;
    }

    .form-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    .submit-button {
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      color: white;
      background: var(--sage-dark);
      font-weight: 700;
    }

    .cancel-button {
      border: 0;
      padding: 10px;
      color: var(--muted);
      background: transparent;
    }

    .submit-button:disabled {
      cursor: wait;
      opacity: .65;
    }

    .status {
      min-height: 22px;
      margin-top: 14px;
      font-size: .88rem;
    }

    .status.success {
      color: var(--sage-dark);
    }

    .status.error {
      color: #b45454;
    }

    /* -------------------------------------------------------
       MESSAGES
    ------------------------------------------------------- */

    .messages-section {
      position: relative;
      z-index: 2;
      padding: 0 24px 64px;
    }

    .section-heading {
      margin-bottom: 28px;
      text-align: center;
    }

    .section-heading .small {
      margin-bottom: 5px;
      color: var(--pink-dark);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .section-heading h2 {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
    }

    .section-heading p {
      margin: 8px auto 0;
      max-width: 520px;
      color: var(--muted);
      font-size: .92rem;
    }

    .messages {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .message {
      position: relative;
      min-height: 170px;
      padding: 24px 23px 22px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(93, 70, 62, .07);
      animation: fadeUp .4s ease both;
    }

    .message:nth-child(4n + 1) {
      background: #fff1ec;
      transform: rotate(-.7deg);
    }

    .message:nth-child(4n + 2) {
      background: #f2f7ef;
      transform: rotate(.6deg);
    }

    .message:nth-child(4n + 3) {
      background: #f0f6fa;
      transform: rotate(-.4deg);
    }

    .message:nth-child(4n + 4) {
      background: #fff8e8;
      transform: rotate(.8deg);
    }

    .message::before {
      content: "♥";
