<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>A Little Love for Baby</title>

  <meta
    name="description"
    content="A collection of wishes and messages for the parents-to-be."
  />

  <!-- Elegant editorial + handwritten typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    /* =====================================================
       COLOR PALETTE
       ===================================================== */

    :root {
      --ivory: #f8f6f0;
      --paper: #fffdfa;
      --ink: #26332c;
      --green: #50665a;
      --green-dark: #35483d;
      --sage: #aebdaf;
      --sage-light: #dfe6dc;
      --blush: #d9b7b1;
      --blush-light: #eee0dc;
      --line: #d8ddd5;
      --muted: #788078;
      --white: #ffffff;

      --shadow:
        0 20px 60px rgba(45, 61, 51, .08);
    }


    /* =====================================================
       BASE
       ===================================================== */

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      color: var(--ink);

      background:
        radial-gradient(
          circle at 5% 10%,
          rgba(174, 189, 175, .28),
          transparent 24%
        ),
        radial-gradient(
          circle at 95% 85%,
          rgba(217, 183, 177, .22),
          transparent 25%
        ),
        var(--ivory);

      font-family: "DM Sans", sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }


    /* =====================================================
       PAGE
       ===================================================== */

    .page {
      width: min(100%, 1120px);
      margin: 0 auto;
      padding: 30px 20px 70px;
    }


    /* =====================================================
       MAIN CARD
       ===================================================== */
